name: Bug report
description: Incorrect behavior in crisp / reveal / emit
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Check [KNOWN_LIMITATIONS](https://github.com/jose-compu/crisp/blob/main/docs/KNOWN_LIMITATIONS.md) first.
  - type: input
    id: version
    attributes:
      label: Crisp / crisp version
      placeholder: "crisp --version → 1.2.0"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal .crp repro
      description: Smallest crate or snippet that shows the bug
      render: crisp
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands run
      description: e.g. crisp check ., crisp test examples/foo
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
