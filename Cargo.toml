[workspace]
resolver = "2"
members = [
    "crates/crpc",
    "crates/crisp-manifest",
    "crates/crisp-lexer",
    "crates/crisp-parser",
    "crates/crisp-ast",
    "crates/crisp-resolve",
    "crates/crisp-typeck",
    "crates/crisp-ownership",
    "crates/crisp-regions",
    "crates/crisp-errors",
    "crates/crisp-cir",
    "crates/crisp-rust-emit",
    "crates/crisp-diagnostics",
    "crates/crisp-reveal",
    "crates/crisp-lsp",
]

[workspace.package]
version = "1.5.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jose-compu/crisp"
homepage = "https://jose-compu.github.io/crisp/"
rust-version = "1.85"

[workspace.dependencies]
# Internal crates (version + path so `cargo publish` can rewrite to registry deps)
crisp-ast = { path = "crates/crisp-ast", version = "1.5.1" }
crisp-lexer = { path = "crates/crisp-lexer", version = "1.5.1" }
crisp-parser = { path = "crates/crisp-parser", version = "1.5.1" }
crisp-resolve = { path = "crates/crisp-resolve", version = "1.5.1" }
crisp-typeck = { path = "crates/crisp-typeck", version = "1.5.1" }
crisp-ownership = { path = "crates/crisp-ownership", version = "1.5.1" }
crisp-regions = { path = "crates/crisp-regions", version = "1.5.1" }
crisp-errors = { path = "crates/crisp-errors", version = "1.5.1" }
crisp-cir = { path = "crates/crisp-cir", version = "1.5.1" }
crisp-rust-emit = { path = "crates/crisp-rust-emit", version = "1.5.1" }
crisp-diagnostics = { path = "crates/crisp-diagnostics", version = "1.5.1" }
crisp-reveal = { path = "crates/crisp-reveal", version = "1.5.1" }
crisp-lsp = { path = "crates/crisp-lsp", version = "1.5.1" }
crisp-manifest = { path = "crates/crisp-manifest", version = "1.5.1" }

# External
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }

[profile.dev]
opt-level = 0

[profile.release]
lto = true
codegen-units = 1
